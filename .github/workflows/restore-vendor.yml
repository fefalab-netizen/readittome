name: Restore vendored PDF.js assets
on:
  push:
    paths:
      - 'vendor/package-info.json'
      - '.github/workflows/restore-vendor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified PDF.js package files
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, tarfile, urllib.request
          root=pathlib.Path('.')
          info=json.loads((root/'vendor/package-info.json').read_text())
          url=info['dist']['tarball']
          if url != 'https://registry.npmjs.org/pdfjs-dist/-/pdfjs-dist-6.4.299.tgz':
              raise ValueError('Unexpected package URL')
          archive=urllib.request.urlopen(url, timeout=90).read()
          expected=base64.b64decode(info['dist']['integrity'].split('-',1)[1])
          if hashlib.sha512(archive).digest()!=expected:
              raise ValueError('Package integrity mismatch')
          requested=set()
          for line in (root/'offline-assets.js').read_text().splitlines():
              item=line.strip().rstrip(',')
              if item.startswith('"./vendor/package/'):
                  requested.add(json.loads(item).removeprefix('./vendor/'))
          if len(requested)!=201:
              raise ValueError(f'Expected 201 assets, got {len(requested)}')
          restored=set()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              for m in tf:
                  if m.name not in requested: continue
                  if not m.isfile(): raise ValueError('Not a regular file: '+m.name)
                  path=root/'vendor'/m.name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(tf.extractfile(m).read())
                  restored.add(m.name)
          if restored!=requested:
              raise ValueError('Missing assets: '+str(sorted(requested-restored)))
          print('Restored',len(restored),'PDF.js assets')
          PY
      - name: Commit vendor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/package
          if ! git diff --cached --quiet; then
            git commit -m "Restore 201 PDF.js vendor assets"
            git push
          fi
